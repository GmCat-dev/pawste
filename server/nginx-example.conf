# paw.gmcat.io: Pawste's home (Claude Code). Serves the Pawste files that live in the tools site folder:
#   /            editor            /<8 or 10 chars>   reader (key, if any, stays after "#")
#   /api/pawste  the gmcat-pawste service      anything else -> tools.gmcat.io (same path)
# PAWSTE_THEME_HASH is filled in by deploy-paw.sh.
server {
    listen 443 ssl;
    server_name paw.gmcat.io;

    ssl_certificate /etc/letsencrypt/live/paw.gmcat.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paw.gmcat.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sites/tools.gmcat.io;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # the editor
    location = / {
        # command line: curl --data-binary @file https://paw.gmcat.io
        if ($request_method = POST) { rewrite ^ /api/pawste/plain last; }
        try_files /pawste/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'PAWSTE_THEME_HASH'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://home.gmcat.io; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }
    # older in-page links to the editor (edit/copy keep their ?query; the #fragment is kept by the browser)
    location = /pawste/ { return 301 /$is_args$args; }

    # Pawste's other pages
    location ~ "^/(secure-note|code-to-image|cli|security|pastebin-alternative)/$" {
        try_files /pawste/$1/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'PAWSTE_THEME_HASH'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://home.gmcat.io; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }
    location ~ "^/(secure-note|code-to-image|cli|security|pastebin-alternative)$" { return 301 /$1/; }
    # the command-line helper (read it, then install it)
    location = /cli.sh { default_type text/plain; try_files /pawste/cli/pawste.sh =404; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
    # short-link pastes as plain text (the service refuses locked and burn-after-reading pastes)
    location ~ "^/raw/([2-9a-hjkmnp-z]{8}(?:[2-9a-hjkmnp-z]{2})?)$" {
        proxy_pass http://127.0.0.1:4198/api/pawste/$1/raw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
    
    # the reader
    location ~ "^/[2-9a-hjkmnp-z]{8}(?:[2-9a-hjkmnp-z]{2})?/?$" {
        default_type text/html;
        try_files /pawste/view/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'PAWSTE_THEME_HASH'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location ^~ /api/pawste {
        proxy_pass http://127.0.0.1:4198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 1m;
        proxy_read_timeout 30s;
    }

    # files the Pawste pages use
    location ^~ /js/ { try_files $uri =404; }
    location ^~ /img/ { try_files $uri =404; expires 7d; add_header Cache-Control "public, max-age=604800" always; }
    location ~ "^/(?:brand\.css|site\.css|theme\.js|insights\.js|404\.html)$" { try_files $uri =404; add_header Cache-Control "no-cache" always; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\nDisallow: /api/\nDisallow: /raw/\nSitemap: https://paw.gmcat.io/sitemap.xml\n"; }
    location = /sitemap.xml { default_type application/xml; try_files /pawste/paw-sitemap.xml =404; }
    location = /favicon.ico { try_files /img/favicon.png =404; expires 7d; }

    # everything else belongs to the Toolbox
    location / { return 301 https://tools.gmcat.io$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name paw.gmcat.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
